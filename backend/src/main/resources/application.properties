
spring.application.name=gerenciador-lanchonete-backend

# Desenvolvimento local: le as variaveis do backend/.env (fora do Git).
# "optional:" faz a aplicacao subir normalmente sem o arquivo (Render, Jenkins, Docker).
# Variaveis de ambiente de verdade tem prioridade sobre os valores do .env.
spring.config.import=optional:file:.env[.properties]

# Conexao com Supabase (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# CORS: origens do front-end separadas por virgula (em producao, a URL da Vercel)
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}

# Supabase Auth (#55): URL do projeto, usada para validar o token (chave pública via JWKS)
app.supabase.url=${SUPABASE_URL:}

# E-mails que nascem ADMIN no cadastro (separados por virgula)
app.admin.emails=${ADMIN_EMAILS:}

# Health check (Render): expoe apenas /actuator/health, sem detalhes internos
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
